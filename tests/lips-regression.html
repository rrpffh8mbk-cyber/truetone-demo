<!doctype html>
<meta charset="utf-8">
<title>Lip ROI regression checks</title>
<pre id="result">Running…</pre>
<script type="module">
import {OUTER,INNER,createLipMask,detectLipLandmarks} from '../lips.js?v=20261006-auto-v2';
import {analyzeImageFile,runFourAgents,circularHueDistance} from '../agents.js?v=20261006-auto-v2';
import {rgbToLab} from '../color-similarity.js?v=20261006-auto-v2';
import {createVirtualTryOn} from '../tryon.js?v=20261006-auto-v2';
const assert=(value,message)=>{if(!value)throw Error(message)};
const landmarks=Array.from({length:468},()=>({x:.5,y:.5}));
for(const [ids,rx,ry] of [[OUTER,.3,.2],[INNER,.14,.08]])ids.forEach((id,i)=>{const angle=i/ids.length*2*Math.PI;landmarks[id]={x:.5+rx*Math.cos(angle),y:.5+ry*Math.sin(angle)}});
let noFace=false,fail=false,busy=false;
window.FaceMesh=class{setOptions(){} onResults(cb){this.cb=cb} async send(){assert(!busy,'FaceMesh requests must be serialized');busy=true;try{await new Promise(r=>setTimeout(r,5));if(fail)throw Error('Unavailable');this.cb({multiFaceLandmarks:noFace?[]:[landmarks]})}finally{busy=false}}};
const canvas=document.createElement('canvas');canvas.width=200;canvas.height=200;const ctx=canvas.getContext('2d');
const file=async()=>new File([await new Promise(r=>canvas.toBlob(r))],'fixture.png',{type:'image/png'});
const strokes=[{radius:.025,points:[{x:.25,y:.35},{x:.75,y:.35}]},{radius:.025,points:[{x:.25,y:.65},{x:.75,y:.65}]}];
const reference={pipeline:'auto-lips-v2',center:{lab:rgbToLab([160,80,80])},samples:[{}]};
try{
 const mask=createLipMask(landmarks,200,200);
 assert(mask.getContext('2d').getImageData(100,100,1,1).data[3]===0,'Mouth interior must be excluded');
 for(const [label,rgb,hue] of [['blue',[20,35,200],235],['red',[180,30,30],0],['purple',[150,30,180],288]]){
  ctx.fillStyle='#d03030';ctx.fillRect(0,0,200,200);
  ctx.fillStyle='rgb('+rgb.join(',')+')';ctx.fillRect(30,60,140,20);ctx.fillRect(30,120,140,20);
  const a=await analyzeImageFile(await file(),{lipSelection:strokes});
  assert(a.metrics.roiDetected&&circularHueDistance(a.metrics.hue,hue)<3,label+' must use selected lip pixels, not the red background');
  if(label==='blue')assert(runFourAgents([a],{colorReference:reference}).score===0,'Blue/warm mismatch must be 0');
  assert(runFourAgents([a],{colorReference:{pipeline:'auto-lips-v2',center:{lab:a.metrics.lab},samples:[{}]}}).score===100,'Identical lip color must be 100');
 }
 const input=await file(),product={analysis:{center:{hue:15,saturation:40,brightness:60}}};
 const pair=await Promise.all([createVirtualTryOn(input,product),createVirtualTryOn(input,product)]);
 assert(pair.every(r=>r.tryon),'Concurrent try-on requests must complete');
 // A uniform blank image must not download a model or acquire a color score.
 ctx.fillStyle='black';ctx.fillRect(0,0,200,200);
 for(const unavailable of [false,true]){
  noFace=!unavailable;fail=unavailable;
  const a=await analyzeImageFile(await file()),report=runFourAgents([a],{colorReference:reference});
  assert(a.metrics.hue===null&&!a.metrics.roiDetected,'Missing region must not fabricate red hue');
  assert(report.score===null,'Missing region must not receive a score');
 }
 noFace=false;fail=false;
 assert((await detectLipLandmarks(canvas)).landmarks,'Detector must recover after failure');
 document.querySelector('#result').textContent='PASS: geometric mouth exclusion, blue/red/purple pixels, red background exclusion, exact color match, blue mismatch, concurrency, missing region and recovery.';
}catch(e){document.querySelector('#result').textContent='FAIL: '+e.stack;throw e}
</script>
